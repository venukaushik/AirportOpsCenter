<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f2038"/>
      <stop offset="100%" stop-color="#081422"/>
    </radialGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAF0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5EEAF0" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="circleClip">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>

  <!-- Outer ring glow -->
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#3FD8E0" stroke-opacity="0.35" stroke-width="1" filter="url(#glow)"/>

  <!-- Main circular screen -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#1E3A52" stroke-width="1.2"/>

  <g clip-path="url(#circleClip)">
    <!-- Range rings -->
    <circle cx="32" cy="32" r="23" fill="none" stroke="#2A4A63" stroke-width="0.7" opacity="0.55"/>
    <circle cx="32" cy="32" r="15" fill="none" stroke="#2A4A63" stroke-width="0.7" opacity="0.55"/>
    <circle cx="32" cy="32" r="7.5" fill="none" stroke="#2A4A63" stroke-width="0.7" opacity="0.5"/>

    <!-- Crosshair lines -->
    <line x1="32" y1="2" x2="32" y2="62" stroke="#2A4A63" stroke-width="0.6" opacity="0.4"/>
    <line x1="2" y1="32" x2="62" y2="32" stroke="#2A4A63" stroke-width="0.6" opacity="0.4"/>

    <!-- Radar sweep (quarter-circle wedge) -->
    <path d="M32 32 L32 2 A30 30 0 0 1 62 32 Z" fill="url(#sweepGrad)" filter="url(#glow)"/>

    <!-- Bright leading edge of sweep -->
    <line x1="32" y1="32" x2="32" y2="2" stroke="#8FF6FA" stroke-width="1.4" filter="url(#glow)"/>
  </g>

  <!-- Center airplane silhouette -->
  <g filter="url(#glow)">
    <path d="M32 20.5
             L33.4 25.5
             L41.5 30.8
             L41.5 32.6
             L33.2 30.2
             L33.9 37.2
             L37 39.4
             L37 41
             L32 39.7
             L27 41
             L27 39.4
             L30.1 37.2
             L30.8 30.2
             L22.5 32.6
             L22.5 30.8
             L30.6 25.5
             Z"
          fill="#F5FBFF"/>
  </g>
</svg>