<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Fuselage + wings + tail, single silhouette (passenger airliner, top-down) -->
    <path
      d="
        M50,4
        C57,4 60,13 60,26
        L60,46
        L97,70
        L97,78
        L61,64
        L61,96
        L81,108
        L81,114
        L60,104
        L57,122
        C56,126 53,129 50,130
        C47,129 44,126 43,122
        L40,104
        L19,114
        L19,108
        L39,96
        L39,64
        L3,78
        L3,70
        L40,46
        L40,26
        C40,13 43,4 50,4
        Z
      "
      fill="#39FF14"
      stroke="#eaffea"
      stroke-width="1.4"
      stroke-linejoin="round"
    />

    <!-- Engine nacelles under each wing, same fill as body -->
    <rect x="68" y="65" width="7" height="15" rx="3" fill="#39FF14" stroke="#eaffea" stroke-width="1"/>
    <rect x="25" y="65" width="7" height="15" rx="3" fill="#39FF14" stroke="#eaffea" stroke-width="1"/>

    <!-- Cockpit window hint -->
    <ellipse cx="50" cy="16" rx="3.5" ry="5" fill="#0a2a0a" opacity="0.5"/>
  </g>
</svg>
